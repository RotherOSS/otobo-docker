# Docker compose file for the OTOBO webapp.
# Note that no port is exposed as both HTTP and HTTPS are supported.
# For HTTP see the extension file docker-compose/otobo-override-http.yml.
# For HTTPS see the extension file docker-compose/otobo-override-https.yml.

# See also README.md.

services:

  # the database server
  db:
    image: ${OTOBO_IMAGE_DB:-mariadb:lts-noble}
    user: mysql:mysql
    cap_drop:
        - ALL
    cap_add:
        - CAP_SYS_CHROOT
    restart: always
    logging:
        driver: "local"
        options:
            max-file: "5"
            max-size: "10m"
    volumes:
      - mariadb_data:/var/lib/mysql

    # Within the container network the MariaDB server listens to its default port 3306.
    # Per default this port is not exposed to the outside world.
    # One can use 'docker-compose exec -it db mysql ...' when access to the database is needed.
    # But for development it can be useful to expose the port 3306. E.g. when a graphical client
    # like MySQL Workbench or DBeaver is used. Uncomment the following lines for making MariaDB available
    # on port 3307 on the Docker host. The non-standard port 3307 is chosen here, because the porr 3306
    # is often already used on the Docker host.
    #
    # In this sample config the port is only exposed to localhost on the Docker host.
    # The config must be adapted if the database should be reachable from other network interfaces.
    # See https://github.com/compose-spec/compose-spec/blob/main/spec.md#ports .
    #
    # Instead of changing the port here one can also use
    # the the compose file docker-compose/otobo-override-db-exposed.yml
    #
    #ports:
    #  - "127.0.0.1:3307:3306"

    # Set the db root password which has to be entered when running otobo/installer.pl.
    # The passwort is secret and can be stored in the file .env.
    # The content of the .env file is something like:
    # OTOBO_DB_ROOT_PASSWORD=otobo_root
    environment:
      MYSQL_ROOT_PASSWORD: ${OTOBO_DB_ROOT_PASSWORD:?err}
      MARIADB_AUTO_UPGRADE: "1"

    # The actual name of the database server executable is provided
    # in the entrypoint of the Docker image.  Up to MariaDB 10.5 the server executable had been called 'mysqld'.
    # Later versions use the executable 'mariadbd'.
    command:
      - --max-allowed-packet=136314880
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-log-file-size=268435456
      - --query-cache-size=${OTOBO_DB_QUERY_CACHE_SIZE:-33554432}

    # See https://mariadb.org/mariadb-server-docker-official-images-healthcheck-without-mysqladmin/
    healthcheck:
        test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]

  # a container running a webserver
  web:
    # The services 'web' and 'daemon' use the same image.
    image: ${OTOBO_IMAGE_OTOBO:-rotheross/otobo:rel-11_1_0-beta2}
    cap_drop:
        - ALL
    #cap_add:
    depends_on:
      - db
      - elastic
    restart: always
    logging:
        driver: "local"
        options:
            max-file: "5"
            max-size: "10m"
    # The HTTP port might be specified in a docker-compose extension file, e.g. docker-compose/otobo-override-http.yml.
    # For HTTPS no HTTP port is exposed.
    #ports:
    #    - "80:5000"
    volumes:
      - opt_otobo:/opt/otobo
      - opt_otobo_update:/opt/otobo_update
    command: web ${OTOBO_WEB_OPTION:-}
    healthcheck:
      test: curl -s -f http://localhost:5000/health | grep ✅ || exit 1

  # a container running the OTOBO daemon
  daemon:
    # The services 'web' and 'daemon' use the same image.
    image: ${OTOBO_IMAGE_OTOBO:-rotheross/otobo:rel-11_1_0-beta2}
    cap_drop:
        - ALL
    #cap_add:
    depends_on:
      - web
    restart: always
    logging:
        driver: "local"
        options:
            max-file: "5"
            max-size: "10m"
    volumes:
      - opt_otobo:/opt/otobo
    command: daemon
    healthcheck:
      test: ./bin/otobo.Daemon.pl status | grep 'Daemon running'

  # a container running Elasticsearch
  elastic:
    image: ${OTOBO_IMAGE_OTOBO_ELASTICSEARCH:-rotheross/otobo-elasticsearch:rel-11_1_0-beta2}
    cap_drop:
        - ALL
    cap_add:
        - CAP_SYS_CHROOT
        - CAP_SETUID
        - CAP_SETGID
    restart: always
    logging:
        driver: "local"
        options:
            max-file: "5"
            max-size: "10m"
    environment:
      discovery.type: single-node
      # allow access via HTTP and without login
      xpack.security.enabled: false
      ES_JAVA_OPTS: ${OTOBO_ELASTICSEARCH_ES_JAVA_OPTS:?err}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl --silent --fail http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
      ]


# no volumes need to be exposed across services
volumes:
  mariadb_data: {}
  opt_otobo: {}
  opt_otobo_update: {}
  elasticsearch_data: {}
