# Docker compose file for the OTOBO webapp.
# Note that no port is exposed as both HTTP and HTTPS are supported.
# For HTTP see the extension file docker-compose/otobo-override-http.yml.
# For HTTPS see the extension file docker-compose/otobo-override-https.yml.

# See also README.md.

# The toplevel attribute 'version' is obsolet and not used by current versions of docker compose.
# The attribute is still provided here because there were problems with standalone Docker Compose 1.25
# after removing the attribute.
version: '3.3'

services:

  # the database server
  db:
    image: ${OTOBO_IMAGE_DB:-postgres:18-trixie}
    user: postgres:postgres
    cap_drop:
        - ALL
    cap_add:
        - CAP_SYS_CHROOT
    restart: always
    logging:
        driver: "local"
        options:
            max-file: "5"
            max-size: "10m"
    volumes:
      - postgresql_data:/var/lib/postgresql

    # Within the container network the PostgreSQL server listens to its default port 5432.
    # Per default this port is not exposed to the outside world.
    # For development it can be useful to expose the port 5432.
    # Uncomment the following lines for making PostgreSQL available.
    # ports:
    #   - "5432:5432"

    # Set the db root password which has to be entered when running otobo/installer.pl.
    # The passwort is secret and can be stored in the file .env.
    # The content of the .env file is something like:
    # OTOBO_DB_ROOT_PASSWORD=otobo_root
    environment:
      POSTGRES_PASSWORD: ${OTOBO_DB_ROOT_PASSWORD:?err}

    # For PostgreSQL no options have to be provided.
    # Note that for 'command' the complete list of options is replaced.
    command: []

    # The health check for PostgreSQL is still to be determined.
    #healthcheck:
    #  test: ["CMD-SHELL", "pg_isready"]

volumes:
  postgresql_data: {}
